name: Run BookOff Profit Finder

on:
  schedule:
    # 毎時実行（トークン回復に合わせて継続処理）
    - cron: '0 * * * *'
  workflow_dispatch:  # 手動実行も可能
    inputs:
      max_pages:
        description: 'もっと見るクリック回数'
        required: false
        type: number
        default: 20

permissions:
  contents: write

jobs:
  find-profits:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests playwright
          playwright install chromium --with-deps

      - name: Run Finder (CD & DVD)
        env:
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SPREADSHEET_WEBHOOK_URL: ${{ secrets.SPREADSHEET_WEBHOOK_URL }}
        run: |
          export PYTHONUNBUFFERED=1
          MAX_PAGES="${{ github.event.inputs.max_pages }}"
          if [ -z "$MAX_PAGES" ]; then
            MAX_PAGES=20
          fi
          python main.py --categories cd dvd --max-pages $MAX_PAGES

      - name: Commit cache and exclusion files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add price_cache.json seen_products.json exclusions.db || true
          git diff --staged --quiet || git commit -m "Update cache and exclusion DB [skip ci]"
          git push || true

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ github.run_number }}
          path: profit_*.csv
          retention-days: 30
          if-no-files-found: ignore
