name: Run BookOff Profit Finder

on:
  schedule:
    # 毎時実行（日本時間で毎時0分）
    - cron: '0 * * * *'
  workflow_dispatch:  # 手動実行も可能

jobs:
  find-profits:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests playwright
          playwright install chromium

      - name: Download caches
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: bookoff-caches
          path: .

      - name: Run Finder (CD New Arrivals)
        env:
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python main.py --new --categories cd

      - name: Run Finder (DVD New Arrivals)
        env:
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python main.py --new --categories dvd

      - name: Upload caches
        uses: actions/upload-artifact@v4
        with:
          name: bookoff-caches
          path: |
            price_cache.json
            seen_products.json
          retention-days: 90
          overwrite: true

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ github.run_number }}
          path: profit_akita_*.csv
          retention-days: 30
          if-no-files-found: ignore
