name: Run BookOff Profit Finder

on:
  schedule:
    # 毎時実行（日本時間で毎時0分）
    - cron: '0 * * * *'
  workflow_dispatch:  # 手動実行も可能
    inputs:
      reset:
        description: 'ページ1から強制リスタート'
        required: false
        type: boolean
        default: false
      max_pages:
        description: '処理ページ数'
        required: false
        type: number
        default: 10

permissions:
  contents: write

jobs:
  find-profits:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run Finder (CD & DVD)
        env:
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SPREADSHEET_WEBHOOK_URL: ${{ secrets.SPREADSHEET_WEBHOOK_URL }}
        run: |
          RESET_FLAG=""
          if [ "${{ github.event.inputs.reset }}" = "true" ]; then
            RESET_FLAG="--reset"
          fi
          MAX_PAGES="${{ github.event.inputs.max_pages }}"
          if [ -z "$MAX_PAGES" ]; then
            MAX_PAGES=10
          fi
          python main.py --categories cd dvd --max-pages $MAX_PAGES $RESET_FLAG

      - name: Commit cache and exclusion files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add price_cache.json seen_products.json exclusions.db || true
          git diff --staged --quiet || git commit -m "Update cache and exclusion DB [skip ci]"
          git push || true

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ github.run_number }}
          path: profit_*.csv
          retention-days: 30
          if-no-files-found: ignore
